<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virgin Voyages - Culinary Station History</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    /* ============================================================
       VIRGIN VOYAGES - SHIP VISIT REPORT STYLE SHEET
       ============================================================ */

    :root {
      --vv-squid: #3C1053;
      --vv-squid-dark: #2A073C;
      --vv-squid-light: #5A2175;

      --vv-red: #E10A0A;
      --vv-red-dark: #CC0000;

      --vv-near-black: #1B1B1B;
      --vv-body: #333333;
      --vv-gray: #8A8A8A;

      --vv-white: #FFFFFF;

      --vv-line: #E7E1EA;
      --vv-bg: #F8F6F9;

      --status-green: #008A52;
      --status-green-bg: #EAF8F0;

      --status-blue: #2463B8;
      --status-blue-bg: #EEF5FF;

      --status-red: #CC0000;
      --status-red-bg: #FFF1F1;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      background: var(--vv-bg);
      color: var(--vv-body);
      font-family: Arial, Calibri, 'Inter', sans-serif;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* PURPLE BAND HEADER */
    .band {
      position: relative;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px;
      color: #FFFFFF;
      background-color: var(--vv-squid);
      background-image: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,.055) 0,
        rgba(255,255,255,.055) 2px,
        transparent 2px,
        transparent 55px
      );
      border-bottom: 4px solid var(--vv-red);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .band h1 {
      margin: 4px 0 2px;
      color: #FFFFFF;
      font-size: 24px;
      line-height: 1.1;
      font-weight: 800;
    }

    .eyebrow {
      color: rgba(255,255,255,.92);
      font-size: 11px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      padding: 4px;
      border-radius: 30px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.85);
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: var(--vv-red);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(225, 10, 10, 0.4);
    }

    /* CONTAINER & VIEWS */
    .page-pad {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 60px;
      flex: 1;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* CARDS */
    .card {
      background: #FFFFFF;
      border: 1px solid var(--vv-line);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(60, 16, 83, 0.04);
    }

    .card-title {
      color: var(--vv-squid);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .03em;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--vv-line);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* FORM STYLES */
    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--vv-squid);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .field input, .field select, .field textarea {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--vv-line);
      border-radius: 8px;
      background: #FFFFFF;
      color: var(--vv-body);
      outline: none;
      font-size: 14px;
      transition: border-color 0.15s ease;
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--vv-squid);
      box-shadow: 0 0 0 2px rgba(60, 16, 83, .08);
    }

    .grid2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    /* BUTTONS */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      border: 1px solid var(--vv-red);
      border-radius: 8px;
      background: var(--vv-red);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      gap: 8px;
      transition: background 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--vv-red-dark);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 16px;
      border: 1px solid var(--vv-squid);
      border-radius: 8px;
      background: #FFFFFF;
      color: var(--vv-squid);
      font-size: 12px;
      font-weight: 800;
      gap: 6px;
    }

    .btn-secondary:hover {
      background: rgba(60, 16, 83, .04);
    }

    /* TABLES */
    .table-container {
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: var(--vv-bg);
      padding: 12px;
      font-weight: 800;
      color: var(--vv-squid);
      border-bottom: 2px solid var(--vv-line);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--vv-line);
      color: var(--vv-body);
    }

    tr:hover td {
      background: rgba(60, 16, 83, .01);
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      background: var(--status-blue-bg);
      color: var(--status-blue);
    }

    /* FOOTER */
    .footer {
      width: 100%;
      margin: auto 0 0;
      padding: 16px 24px;
      background: #FFFFFF;
      border-top: 1px solid var(--vv-line);
      text-align: center;
      color: var(--vv-gray);
      font-size: 11px;
    }

    @media (max-width: 768px) {
      .grid2, .grid3 {
        grid-template-columns: 1fr;
      }
      .band {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- VIRGIN VOYAGES HEADER BAND -->
  <div class="band">
    <div>
      <div class="eyebrow">Virgin Voyages Operations</div>
      <h1>Culinary Station History Tracker</h1>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('log-entry-view')">
        <i data-lucide="plus-circle" style="width:14px; height:14px;"></i> Add Entry
      </button>
      <button class="tab-btn" onclick="switchTab('history-view')">
